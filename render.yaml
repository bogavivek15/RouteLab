services:
  - type: web
    name: callflow-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r services/api/requirements.txt
    startCommand: uvicorn services.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CALLFLOW_LLM_MODEL
        value: gemini-2.0-flash
      - key: CALLFLOW_CORS_ORIGIN
        value: "*"
